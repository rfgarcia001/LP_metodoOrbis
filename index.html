<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Método Orbis — uma nova jornada de autoconhecimento.">
  <title>Método Orbis</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #101827;
      color: #f5f1e8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    main { width: 100%; max-width: 540px; }
    .tag { color: #d6b87a; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 20px 0 12px; font-size: clamp(3rem, 15vw, 5rem); line-height: 1.1; }
    p { color: #b8bfcc; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <div class="tag">Método Orbis</div>
    <h1>ORBIS</h1>
    <p>Uma jornada de autoconhecimento começa aqui.</p>
    <p>Em breve.</p>
  </main>
</body>
</html>
